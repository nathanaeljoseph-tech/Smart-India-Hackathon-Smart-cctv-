# =========================================
# 3-Tier Spatial Model (top ΓåÆ bottom):
#
#   ΓöîΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÉ  ΓöÇΓöÇΓöÇ y = 0
#   Γöé                                    Γöé
#   Γöé         PERIMETER ZONE             Γöé  y = 0 to y = 576  (top 80%)
#   Γöé       (type: restricted)           Γöé  ΓåÆ immediate intrusion alert
#   Γöé                                    Γöé
#   Γö£ΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöñ  ΓöÇΓöÇΓöÇ y = 576  (80% of 720)
#   Γöé         APPROACH BAND              Γöé  y = 576 to y = 720  (bottom 20%)
#   Γöé          (type: monitor)           Γöé  ΓåÆ approach behaviour detected
#   ΓööΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÿ  ΓöÇΓöÇΓöÇ y = 720
#
# Scale factor: scale_zones_to_frame() in main.py auto-scales these
# pixel coordinates to match whatever camera resolution is in use.

reference_resolution:
  - 1280
  - 720

# ---------------------------------------------------------------------------
# Behaviour / Risk Engine constants
# All values here are read by RiskEngine.__init__() and override the
# module-level defaults in modules/risk_engine.py
# ---------------------------------------------------------------------------

# Bottom fraction of frame height treated as the "approach band"
# 0.20 = bottom 20 % of the frame.  Tune this if your camera angle changes.
approach_band_ratio: 0.20

# Track must be this many frames old before behaviour is assigned.
# Prevents jitter on brand-new detections.
min_track_len_for_behavior: 12

# Continuous dwell time inside the perimeter zone to trigger a loiter alert.
min_loiter_seconds: 8

# ---------------------------------------------------------------------------
# Too-close filtering
# ---------------------------------------------------------------------------
# If a person's bounding-box height exceeds this fraction of the frame height
# they are considered "very close to the camera" (< ~2 ft away / 15-30 cm).
# Such detections are excluded from distance tracking and trigger a CRITICAL PROXIMITY BREACH alert.
too_close_height_ratio: 0.70

# Minimum confidence required to accept a very-close detection.
# Lowered to 0.35 to ensure macro close-ups and camera obstructions are not missed.
too_close_conf_threshold: 0.35

# Proximity threat settings
proximity_threat_enabled: true
proximity_risk_score: 98.0

# ---------------------------------------------------------------------------
# Risk engine parameters
# ---------------------------------------------------------------------------
risk:
  # Base risk contribution for each behaviour type (0ΓÇô100 scale)
  base_approach: 20    # Person in approach band moving toward camera
  base_access:   40    # Person confirmed inside restricted zone
  base_loiter:   55    # Person loitering in restricted zone

  # Additional risk per second of continuous loitering (stacks on base_loiter)
  loiter_bonus_per_sec: 2.5

  # Risk decay: points shed per SECOND when behaviour returns to "none"
  # Higher = faster decay; lower = risk lingers longer after person retreats
  decay_rate: 8.0

  # Hysteresis: maximum risk DROP per frame (prevents flickering)
  hysteresis_band: 5.0

  # Night-time multiplier applied to the final risk score when --night is set
  night_multiplier: 1.30

# ---------------------------------------------------------------------------
# Tier-2 Enhancements Configuration
# ---------------------------------------------------------------------------

# Feature 1: Animal-vs-Human Suppression
animal_suppression_enabled: true
animal_suppressed_risk: 0.0

# Feature 2: Zone Context Memory penalty
context_penalty_weight: 30.0

# Feature 3: Abandoned Object Detection
abandoned:
  enabled: true
  stationary_threshold: 10.0          # Base seconds object must remain stationary (bags)
  stationary_threshold_vehicle: 15.0 # Base seconds for vehicles
  stationary_threshold_device: 12.0  # Base seconds for small devices
  owner_distance_threshold: 120.0     # Pixels before owner is considered separated
  owner_absent_threshold: 5.0         # Seconds owner absent before triggering
  abandoned_risk_score: 75.0          # Base risk score for abandoned objects
  night_threshold_multiplier: 0.70    # Stricter dwell threshold multiplier at night (faster alert)

# Feature 4: Illumination & Day/Night Preprocessing
illumination:
  auto_night: true
  low_thresh: 50.0                # Luminance < 50 triggers NIGHT
  high_thresh: 70.0               # Luminance > 70 triggers DAY
  clahe_clip: 2.0
  clahe_grid: [8, 8]

# ---------------------------------------------------------------------------
# Zone definitions
# ---------------------------------------------------------------------------
zones:
  # ── Zone 1: Main restricted perimeter (top 80 % of frame) ───────────────
  # Any person entering this zone triggers an immediate intrusion alert.
  - id: perimeter
    type: restricted
    polygon:
      - [0,    0]
      - [1280, 0]
      - [1280, 576]   # 576 = 720 * 0.80
      - [0,    576]
    min_loiter_seconds: 8
    allowed_objects: ["person"]
    time_windows: ["06:00-22:00"]
    time_rules:
      - time_window: "22:00-06:00"
        override_type: secure
        override_expected_objects: []
        description: "Overnight strict lockdown"
    night_multiplier: 1.40

  # ── Zone 2: Approach band (bottom 20 % of frame) ─────────────────────────
  # Monitored but not restricted — presence alone does not trigger an alert.
  # The risk engine uses this band to detect "approaching" behaviour.
  # min_loiter_seconds is set very high so loitering never fires here.
  - id: approach_band
    type: monitor
    polygon:
      - [0,    576]   # top of approach band
      - [1280, 576]
      - [1280, 720]
      - [0,    720]
    min_loiter_seconds: 9999
    allowed_objects: ["person", "animal"]
    time_rules: []
    night_multiplier: 1.20

